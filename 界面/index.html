<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="workbench-token" content="__LOCAL_TOKEN__">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Post Studio · 界面预览</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header class="titlebar">
    <div class="wordmark"><span class="brand-icon" aria-hidden="true">◈</span> Local Post Studio</div>
    <div class="project-name"><button data-action="project-list" id="studio-button">项目</button> <strong id="studio-name">原工作台</strong></div>
    <div class="palette" role="img" aria-label="陶土、米白、蓝灰与炭黑色板">
      <i class="clay"></i><i class="ivory"></i><i class="blue"></i><i class="ink"></i>
    </div>
    <div class="title-actions"><span id="save-state">界面预览</span><button id="locale" lang="en" aria-label="切换界面语言">EN</button><button id="settings">界面设置</button></div>
  </header>
  <nav id="navigation" aria-label="工作区"></nav>
  <main>
    <svg class="upper-art workspace-art" viewBox="0 0 520 112" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width=".8">
        <path d="M9 45V27h22m440 0h22v18M9 77v18h22m440 0h22V77"/>
        <path d="M22 61h462" stroke-dasharray="2 6"/>
        <path d="M240 17v90m-8-46h16M397 17v90"/>
        <circle cx="397" cy="61" r="35"/><circle cx="397" cy="61" r="27" stroke-dasharray="1 5"/>
        <path d="M76 78V44m19 34V38m19 40V49m19 29V34m19 44V43m19 35V53m19 25V46"/>
      </g>
      <g class="signal-line" stroke="currentColor" stroke-width="1.15">
        <path d="M29 65h22l12-8 14 10 18-16 14 14 15-4 12-18 16 25 20-12 16 7 15-2 23 3h79"/>
        <path d="M304 64l-5-4m5 4-5 4"/><circle cx="136" cy="43" r="2.5" fill="currentColor"/>
      </g>
    </svg>
    <svg class="workspace-art" viewBox="0 0 720 440" aria-hidden="true" fill="none">
      <g class="aperture-lines" stroke="currentColor">
        <circle cx="500" cy="244" r="164"/><circle cx="500" cy="244" r="150" stroke-dasharray="1 8"/>
        <circle cx="500" cy="244" r="108"/><path d="M500 157 576 201 576 287 500 331 424 287 424 201Z M500 157l74 131m2-87H425m151 86-76-130m0 174-74-131m-2 87h151m-151-86 76 130"/>
        <path d="M302 244h36m324 0h36M500 44v36m0 328v27"/>
      </g>
      <g class="film-lines" stroke="currentColor">
        <path d="M32 325h281m-281 70h281m-270-59h253v47H43z" />
        <path d="M64 338v43m48-43v43m48-43v43m48-43v43m48-43v43"/>
        <path d="M39 330h257m-257 60h257" stroke-width="3" stroke-dasharray="6 9"/>
      </g>
    </svg>
    <aside class="library" aria-labelledby="library-label">
      <div class="library-title"><h2 id="library-label">项目素材</h2><div class="library-actions"><button id="expand-library" aria-expanded="false" aria-label="展开素材库" title="展开素材库">⤢</button><button id="add" aria-label="导入素材" title="导入素材">＋</button></div></div>
      <div class="library-organize"><button id="new-group">＋ 新建文件夹</button><button id="trash">已移除</button></div>
      <input id="search" type="search" placeholder="搜索素材" aria-label="搜索素材">
      <div class="library-tools"><label><input type="checkbox" id="select-all"> 全选</label><select id="sort" aria-label="排序"><option value="recent">导入顺序</option><option value="name">按名称</option><option value="size">按大小</option></select></div>
      <p class="library-hint">空白处拖动框选 · 选中后拖入文件夹</p>
      <div id="media-list"></div>
      <div id="batch" class="batch"></div>
      <button id="legacy" class="sample-link">导入旧版项目</button>
      <button id="samples" class="sample-link" hidden>载入示例项目</button>
    </aside>
    <div class="resize" id="library-resize" role="separator" aria-label="调整素材栏宽度" aria-orientation="vertical" tabindex="0"></div>
    <section id="workspace" aria-label="活动工作区"></section>
  </main>
  <footer><span>本地处理</span><span class="footer-right system-usage"><span>CPU <strong id="cpu-usage">—</strong></span><span>内存 <strong id="memory-usage">—</strong></span></span></footer>
  <dialog id="modal" aria-labelledby="modal-title"><form method="dialog" class="panel-head"><div><p class="picker-eyebrow">CODEC LIBRARY</p><h2 id="modal-title"></h2></div><button aria-label="关闭"><span class="picker-close-icon" aria-hidden="true">×</span><span class="generic-close">关闭</span></button></form><div id="modal-content"></div></dialog>
  <dialog id="color-picker" class="color-picker-dialog" aria-labelledby="color-picker-title">
    <form method="dialog" class="panel-head">
      <div><p id="color-picker-eyebrow" class="picker-eyebrow"></p><h2 id="color-picker-title"></h2></div>
      <button class="picker-close-icon" aria-label="关闭">×</button>
    </form>
    <div class="color-picker-tools">
      <div id="color-steps" class="color-steps" aria-label="选择步骤"></div>
      <input id="color-search" type="search" placeholder="搜索品牌、色域、曲线或机型" aria-label="搜索品牌、色域、曲线或机型">
    </div>
    <div id="color-options" role="region" aria-label="色彩预设" tabindex="0"></div>
    <div class="color-picker-footer">
      <div id="color-draft" aria-live="polite"></div>
      <button id="color-back" type="button">返回</button>
      <button id="color-cancel" type="button">取消</button>
      <button id="color-apply" type="button" class="primary">应用预设</button>
    </div>
  </dialog>
  <input type="file" id="files" accept="video/*,audio/*,.mov,.mkv,.mxf,.m4a" multiple hidden>
  <div id="toast" role="status" hidden></div>
  <script src="locale.js"></script>
  <script src="workspace-previews.js"></script>
  <script src="studio.js"></script>
</body>
</html>
